# ==============================================================================
# EMPEROR SAAS PLATFORM — HARDENED PRODUCTION NGINX CONFIGURATION
# WITH ENTERPRISE ANTI-DDOS, RATE LIMITING & CLOUDFLARE INTEGRATION
# ==============================================================================

# Rate Limiting & Connection Limiting Zones (Allocated in Shared RAM)
# 1. API Global Zone: 30 requests/second per IP with burst allowance
limit_req_zone $binary_remote_addr zone=emperor_api_limit:20m rate=30r/s;

# 2. Strict Auth & Login Zone: 5 requests/minute per IP (Anti-Brute-Force)
limit_req_zone $binary_remote_addr zone=emperor_auth_limit:10m rate=5r/m;

# 3. Concurrent Connections Zone: Prevents Slowloris socket exhaustion
limit_conn_zone $binary_remote_addr zone=emperor_conn_limit:20m;

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name emperor.vip www.emperor.vip;
    return 301 https://$host$request_uri;
}

# Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name emperor.vip www.emperor.vip;

    root /var/www/emperor/public;
    index index.php index.html;

    # SSL Certificates (Let's Encrypt / Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/emperor.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emperor.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ══════════════════════════════════════════════════════════════════════
    # ANTI-DDOS, SLOWLORIS & CONNECTION HARDENING
    # ══════════════════════════════════════════════════════════════════════
    # Max concurrent connections per single IP address
    limit_conn emperor_conn_limit 40;

    # Slowloris Defense: strict read timeouts to drop dead/stalling connections
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 25s;
    send_timeout 10s;

    # Buffer Limits (Mitigate memory exhaustion attacks)
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_max_body_size 12M;

    # ══════════════════════════════════════════════════════════════════════
    # CLOUDFLARE REAL IP RESTORATION (Trust Cloudflare Edge IPs)
    # ══════════════════════════════════════════════════════════════════════
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2;

    # Static Assets Caching (Served directly by Nginx without touching PHP/DB)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Strict Rate Limiting on Login & Auth Endpoints (5 attempts / min)
    location ~* /(admin/login|api/v1/auth/login|api/v1/auth/register) {
        limit_req zone=emperor_auth_limit burst=8 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API General Rate Limiting
    location /api/ {
        limit_req zone=emperor_api_limit burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # SPA History Mode & PHP Processing
    location / {
        limit_req zone=emperor_api_limit burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel Reverb WebSockets Proxy
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Block access to hidden & sensitive files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Block common vulnerability scanners & probes
    location ~* (eval-stdin\.php|xmlrpc\.php|wp-admin|phpmyadmin|\.git|\.env) {
        return 404;
    }
}
