[program:emperor-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/emperor/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/emperor/storage/logs/supervisor_queue.log
stopwaitsecs=3600

[program:emperor-reverb]
command=php /var/www/emperor/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/emperor/storage/logs/supervisor_reverb.log
